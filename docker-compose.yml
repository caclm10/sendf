services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sendf-app:latest
    container_name: sendf-app
    restart: unless-stopped
    expose:
      - "5000" # Hanya dapat diakses oleh kontainer lain di dalam jaringan Docker
    environment:
      - PORT=5000
      - NODE_ENV=production
      - APP_NAME=sendf
      - APP_URL=http://localhost # Sesuaikan dengan domain Anda jika diperlukan
    volumes:
      - sendf-uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: sendf-nginx
    restart: unless-stopped
    ports:
      - "80:80" # Memetakan port HTTP 80 VPS langsung ke Nginx di dalam Docker
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Mount file konfigurasi Nginx kita
    depends_on:
      - app

volumes:
  sendf-uploads:
    driver: local
