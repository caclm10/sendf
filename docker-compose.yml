version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sendf:latest
    container_name: sendf-app
    restart: unless-stopped
    ports:
      - "5000:5000" # Ubah port host pertama (kiri) jika port 5000 sudah terpakai (contoh: "8080:5000")
    environment:
      - PORT=5000
      - NODE_ENV=production
      - APP_NAME=sendf
      - APP_URL=http://localhost:5000 # Sesuaikan port dan URL ini jika Anda memetakan port host yang berbeda
    volumes:
      - sendf-uploads:/app/uploads

volumes:
  sendf-uploads:
    driver: local
