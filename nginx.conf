server {
    listen 80;
    server_name localhost; # Dapat menerima domain apa saja yang diarahkan ke VPS Anda

    # Batas ukuran upload file (200MB)
    client_max_body_size 200M;

    location / {
        # Mengarahkan trafik ke kontainer bernama 'app' pada port 5000
        proxy_pass http://app:5000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Integrasi IP asli Cloudflare
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout upload file besar
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
